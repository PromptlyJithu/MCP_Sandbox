[project]
name = "mcp-sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jithu Jomon", email = "jithujiji90@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "langchain[mcp]>=1.4.9",
